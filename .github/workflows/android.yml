name: Android

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; this workflow uses no secrets.
permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner's preinstalled SDK contains newer platforms than the project uses,
      # which changes lint results. Build against exactly the packages named in
      # app/build.gradle.kts (compileSdk, buildToolsVersion) in a fresh SDK directory.
      - name: Install pinned Android SDK packages
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          "$sdkmanager" --sdk_root="$sdk_root" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Check formatting, lint, unit tests and debug build
        run: ./gradlew spotlessCheck lint testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newsfeed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
