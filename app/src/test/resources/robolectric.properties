# Robolectric runs Android 15 (API 35) and newer only on Java 21, and this project builds and tests
# with JDK 17, so the UI tests run against Android 14. The app itself still targets API 36.
sdk=34
# A typical phone screen instead of Robolectric's small default, so that the tests see what a phone
# shows without scrolling.
qualifiers=w411dp-h891dp
